<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>rho</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="css/static.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" integrity="sha384-zh0CIslj+VczCZtlzBcjt5ppRcsAmDnRem7ESsYwWwg3m/OaJ2l4x7YBZl9Kxxib" crossorigin="anonymous">
    <!-- JS for MathJax -->
    <script>
        window.MathJax = {
            tex: {
            inlineMath: [['\\(','\\)']],
            displayMath: [ ['$$','$$'], ["\\[","\\]"], ]
            },
            startup: {
            ready: () => {
                    // Function to iterate over all pre and code elements
                    // if they contain TeX/LaTeX code for maths as defined
                    // by the markers in tex settings above then copy their
                    // textContent before them and remove the element from
                    // the DOM. 
                    
                    // get pre and code elements
                    var prelist = document.getElementsByTagName("pre");
                    var codelist = document.getElementsByTagName("code");
                    // get delimiters for inline and display math
                    var inline = MathJax.config.tex.inlineMath;
                    var display = MathJax.config.tex.displayMath;
                    // start building  a RegExp for each of these math types
                    var inlineRegexList = [];
                    var displayRegexList =[];
                    for(i=0;i<inline.length;i++) {
                        // https://stackoverflow.com/questions/3446170/escape-string-for-use-in-javascript-regex
                        delimLEsc = inline[i][0].replace(/[\-\[\]\/\{\}\(\)\*\+\?\.\\\^\$\|]/g, "\\$&");
                        //alert(delimLEsc);
                        delimREsc = inline[i][1].replace(/[\-\[\]\/\{\}\(\)\*\+\?\.\\\^\$\|]/g, "\\$&");
                        inlineRegexList.push("("+delimLEsc+")((.|[\\r\\n\\t])*?)("+delimREsc+")");
                    };
                    for(i=0;i<display.length;i++) {
                        // https://stackoverflow.com/questions/3446170/escape-string-for-use-in-javascript-regex
                        delimLEsc = display[i][0].replace(/[\-\[\]\/\{\}\(\)\*\+\?\.\\\^\$\|]/g, "\\$&");
                        //alert(delimLEsc);
                        delimREsc = display[i][1].replace(/[\-\[\]\/\{\}\(\)\*\+\?\.\\\^\$\|]/g, "\\$&");
                        displayRegexList.push("("+delimLEsc+")((.|[\\r\\n\\t])*?)("+delimREsc+")");
                    };
                    inlineRegExp = new RegExp(inlineRegexList.join("|"));
                    displayRegExp = new RegExp(displayRegexList.join("|"));
                    
                    // iterate over pre elements applying RegExp
                    // iterate "backwards" as we are removing elements!
                    for (i=prelist.length; i>0; i--) {
                        if(displayRegExp.test(prelist[i-1].textContent)) {
                            var t = document.createTextNode(prelist[i-1].textContent);
                            prelist[i-1].parentNode.insertBefore(t,prelist[i-1]);
                            prelist[i-1].parentNode.removeChild(prelist[i-1]);
                        }
                    }
                    // iterate over code elements applying RegExp
                    // iterate "backwards" as we are removing elements!
                    for (i=codelist.length; i>0; i--) {
                        if(inlineRegExp.test(codelist[i-1].textContent)) {
                            var t = document.createTextNode(codelist[i-1].textContent);
                            codelist[i-1].parentNode.insertBefore(t,codelist[i-1]);
                            codelist[i-1].parentNode.removeChild(codelist[i-1]);
                        }
                    }
                // Now process the page in MathJax
                MathJax.startup.defaultReady();
            }
            }
        };
        </script>
        <script type="text/javascript" id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
        </script>
        <style>
            @font-face {
                font-family: 'Font Awesome 6 Free';
                font-style: normal;
                font-weight: 900;
                font-display: block;
                src: url('/fonts/fa-solid-900.woff2') format('woff2');
            }
            @font-face {
                font-family: 'Font Awesome 6 Brands';
                font-style: normal;
                font-weight: 400;
                font-display: block;
                src: url('/fonts/fa-brands-400.woff2') format('woff2');
            }
            body {
                font-family:'Lucida Console', monospace;
                font-size: 18px;
                color: #111;
                background-color: white;
                max-width: 1280px;
                margin: 0 auto;
                padding: 0 50px;
                box-sizing: border-box;
            }
            .rho {color: #4C9D9B;}
            .footer {text-align: center; display: block; margin-top: 60px; margin-bottom: 60px;}
            .footer a { text-decoration: none; }
            .footer-rho { color: grey; transition: color 0.2s; }
            .footer-rho:hover { color: #4C9D9B; }
            .footer-rho svg { width: 40px; height: auto; vertical-align: middle; }
            .contact { font-size: 0.85em; margin-top: 1em; }
            .fa-icon { margin-right: 0.3em; }
            .fa-icon-solid { font-family: 'Font Awesome 6 Free'; font-weight: 900; }
            .fa-icon-brand { font-family: 'Font Awesome 6 Brands'; font-weight: 400; }
            @media (max-width: 600px) {
                .contact { display: flex; flex-direction: column; align-items: center; gap: 0.5em; }
                .contact .sep { display: none; }
            }
            hr { border: none; height: 2px; background-color: lightgrey; width: 100%; margin: 30px auto; }
            .giallo-l {
                display: inline-block;
                min-height: 1lh;
                width: 100%;
            }
            .giallo-ln {
                display: inline-block;
                user-select: none;
                margin-right: 0.4em;
                padding: 0.4em;
                min-width: 3ch;
                text-align: right;
                opacity: 0.8;
            }
            img {
            display: block;
            max-width: 40%;
            height: auto;
            cursor: pointer;
            transition: max-width 0.3s ease;
            margin: 1em 0;
            }
            img.zoomed {
            max-width: 100%;
            }
            .svg-container {
                text-align: center;
                margin: 2em 0;
            }
            .svg-container img {
                max-width: 100%;
                cursor: default;
                margin: 0 auto;
            }
            .toc {
                margin: 2em 0;
                padding: 1em;
                background-color: #f8f8f8;
                border-left: 3px solid #4C9D9B;
            }

            .toc-h1 {
                margin: 0.5em 0;
                font-weight: bold;
            }

            .toc-h2 {
                margin: 0.3em 0 0.3em 1.5em;
                font-size: 0.95em;
            }

            .toc-h3 {
                margin: 0.2em 0 0.2em 3em;
                font-size: 0.9em;
            }

            pre {
                position: relative;
            }

            .copy-btn {
                position: absolute;
                top: 6px;
                right: 6px;
                background: none;
                border: 1px solid #ccc;
                color: #888;
                font-family: inherit;
                font-size: 0.75em;
                padding: 2px 8px;
                cursor: pointer;
                opacity: 0;
                transition: opacity 0.2s;
            }

            pre:hover .copy-btn {
                opacity: 1;
            }

            .copy-btn:hover {
                color: #4C9D9B;
                border-color: #4C9D9B;
            }

            a {
                text-decoration: underline;
                text-decoration-style: dotted;
                text-underline-offset: 3px;
                text-decoration-color: #4C9D9B;
                color: inherit;
            }

            a:hover {
                color: #4C9D9B;
                text-decoration-style: solid;
            }

        </style>

        {% block head %}{% endblock head %}
</head>
<body>
  {% block content %}{% endblock content %}
  <div class="footer">
    <a href="/" class="footer-rho"><svg viewBox="-1 -2 20 30" xmlns="http://www.w3.org/2000/svg"><text style="font-weight:bold;font-size:35.2777px;font-family:Helvetica;letter-spacing:-2.98979px;fill:currentColor" x="0.18" y="16.97">𝜌</text></svg></a>
    <p class="contact">
      <a href="mailto:kontaktrho@gmail.com"><span class="fa-icon fa-icon-solid">&#xf0e0;</span>kontaktrho@gmail.com</a><span class="sep"> · </span><a href="https://instagram.com/webrho"><span class="fa-icon fa-icon-brand">&#xf16d;</span>@webrho</a><span class="sep"> · </span><a href="https://discord.gg/kDBPrpqW"><span class="fa-icon fa-icon-brand">&#xf392;</span>rho 𝜌 community</a>
    </p>
  </div>
  <script>document.addEventListener('click',e=>{if(e.target.tagName==='IMG'&&!e.target.closest('.svg-container'))e.target.classList.toggle('zoomed')})</script>
  <script>
    document.querySelectorAll('pre').forEach(pre => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'copy';
      btn.addEventListener('click', () => {
        const code = pre.querySelector('code');
        navigator.clipboard.writeText((code || pre).textContent).then(() => {
          btn.textContent = 'copied!';
          setTimeout(() => btn.textContent = 'copy', 1500);
        });
      });
      pre.appendChild(btn);
    });
  </script>
</body>
</html>
