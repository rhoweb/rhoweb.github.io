{% extends "base.html" %}

{% block content %}
<div class="breadcrumb"><a href="/">/</a>people</div>
<h1 class="title">people</h1>
<p class="people-legend"><span class="legend-swatch"></span> chip design team</p>

{% for group in section.extra.groups %}
<h2>{{ group.name }}</h2>
<div class="people-grid">
    {% for member in group.members %}
    <div class="person-card">
        <div class="person-img{% if member.chip_team %} chip-team{% endif %}"><img src="photos/{{ member.photo }}" alt="{{ member.name }}"></div>
        <div class="person-name">{{ member.name }}</div>
        <div class="person-role">{{ member.role }}</div>
    </div>
    {% endfor %}
</div>
{% endfor %}

{% endblock content %}
